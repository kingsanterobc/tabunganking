<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Aplikasi Saya</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1f2933;
    }

    /* Frame aplikasi GAS memenuhi seluruh layar */
    #app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #ffffff;
    }

    /* Layar status: memuat / gagal / belum diatur */
    #status {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      background: #ffffff;
      z-index: 10;
      transition: opacity .25s ease;
    }
    #status.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #d9e0e7;
      border-top-color: #2b6cb0;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #status p { margin: 0; max-width: 34ch; line-height: 1.5; }
    #status .title { font-weight: 600; font-size: 1.05rem; }
    #status code {
      background: #eef2f6;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: .9em;
    }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      background: #2b6cb0;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: .95rem;
    }
    .btn:focus-visible { outline: 3px solid #90cdf4; outline-offset: 2px; }

    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2.4s; }
      #status { transition: none; }
    }
  </style>
</head>
<body>

  <iframe
    id="app-frame"
    title="Aplikasi"
    allow="clipboard-read; clipboard-write; fullscreen; camera; microphone; geolocation; autoplay"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade"></iframe>

  <div id="status" role="status" aria-live="polite">
    <div class="spinner" id="spinner"></div>
    <p class="title" id="status-title">Memuat aplikasi</p>
    <p id="status-text">Mohon tunggu sebentar.</p>
    <a class="btn" id="open-link" href="#" target="_blank" rel="noopener" hidden>Buka di tab baru</a>
  </div>

  <script>
    /* ============================================================
       PENGATURAN: tempel URL hasil deploy di antara tanda kutip.
       Contoh: https://script.google.com/macros/s/AKfycb.../exec
       ============================================================ */
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzbgyfLLGUAZl9wiKfEDFkQrcRRgyoFCYAsxX-BkHApvurEdM5dJGDQgkLUcpPlO6bb/exec";

    /* Judul tab browser (opsional) */
    const JUDUL = "Tabungan King Santero";

    /* Batas waktu menunggu sebelum menampilkan tombol cadangan (ms) */
    const BATAS_WAKTU = 15000;

    /* ============================================================
       Di bawah ini tidak perlu diubah.
       ============================================================ */
    (function () {
      const frame = document.getElementById("app-frame");
      const status = document.getElementById("status");
      const spinner = document.getElementById("spinner");
      const title = document.getElementById("status-title");
      const text = document.getElementById("status-text");
      const openLink = document.getElementById("open-link");

      document.title = JUDUL;

      const belumDiatur =
        !GAS_URL ||
        GAS_URL.indexOf("TEMPEL_URL") !== -1 ||
        !/^https:\/\/script\.google\.com\//.test(GAS_URL);

      if (belumDiatur) {
        spinner.hidden = true;
        title.textContent = "URL deploy belum diatur";
        text.innerHTML = "Buka <code>index.html</code>, lalu isi <code>GAS_URL</code> dengan URL web app dari Apps Script.";
        return;
      }

      /* Teruskan parameter URL (misalnya ?page=laporan) dan hash ke aplikasi GAS */
      let target = GAS_URL;
      if (location.search) {
        target += (GAS_URL.indexOf("?") === -1 ? "" : "&") +
                  (GAS_URL.indexOf("?") === -1 ? location.search : location.search.slice(1));
      }
      if (location.hash) target += location.hash;

      openLink.href = target;

      let selesai = false;

      frame.addEventListener("load", function () {
        selesai = true;
        status.classList.add("hidden");
      });

      setTimeout(function () {
        if (selesai) return;
        spinner.hidden = true;
        title.textContent = "Aplikasi belum tampil";
        text.textContent = "Pastikan akses deploy diatur ke \"Anyone\", lalu coba buka langsung.";
        openLink.hidden = false;
      }, BATAS_WAKTU);

      frame.src = target;
    })();
  </script>
</body>
</html>
